[project]
name = "logos"
version = "0.1.0"
description = "A desktop AI assistant that sees your screen and clicks buttons for you. What could possibly go wrong?"
readme = "README.md"
license = { text = "MIT" }
requires-python = "==3.12.*"
dependencies = [
    "pyside6",
    "pyautogui",
    "mss",
    "pillow",
    "psutil",
    "requests",
    "pynput",
    "qtawesome",
    "thefuzz",
    "python-Levenshtein",
    "json_repair",
    "pydantic",
    "installed-apps-scanner",
    "keyring",
    "google-genai",
    "google-api-core",
    "openai",
    "anthropic",
    "xai_sdk",
    "httpx",
    "pyperclip",
    "playwright",
    "watchdog",
    "trafilatura",
    "ddgs",
    "markdown",
    "pygments",
    "sumy",
    "nltk",
    "rapidfuzz",
    "pathspec",
    "ruff",
    "mcp>=2.3.0",
]

[tool.uv]
index = [
    { url = "https://pypi.org/simple" }
]

[tool.ruff]
line-length = 500
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes errors
    "W",   # pycodestyle warnings
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # flake8-comprehensions
    "TID", # tidy-imports - useful for unused imports
    "ISC", # flake8-implicit-str-concat
]
ignore = [
    "B008", # Do not perform function calls in argument defaults. (Sometimes needed for Qt signals)
    "N802", # Function name `_execute_get_response` should be lowercase
    "N803", # Argument name `prompt` should be lowercase
    "N806", # Variable `status_code` in function should be lowercase
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"] # Allow unused imports in __init__.py files
"setup_ubuntu.sh" = ["E"] # Ignore all pycodestyle errors for shell script
"setup_windows.ps1" = ["E"] # Ignore all pycodestyle errors for shell script
"tests/*" = ["E", "F", "W", "I", "N", "UP", "B", "C4", "TID", "ISC"] # Ignore all Ruff errors in the tests directory
"src/llm/providers/*" = ["TID252"] # Relative imports keep a single module identity for exceptions (llm.* vs src.llm.* duality breaks `except RetryableError` in llm_worker)

[tool.ruff.lint.isort]
known-first-party = ["src"]
force-sort-within-sections = true
