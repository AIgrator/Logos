<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>#scroll — прокрутка</title>
<style>
  body { font-family: Segoe UI, Arial, sans-serif; background: #1e1e1e; color: #eee;
         margin: 0; padding: 0; }
  nav { background: #2a2a2a; padding: 10px 16px; position: sticky; top: 0; z-index: 50; }
  nav a { color: #6cb6ff; font-size: 16px; margin-right: 14px; text-decoration: none; }
  h1 { font-size: 22px; text-align: center; margin: 16px 20px; }
  .filler { height: 90vh; display: flex; align-items: center; justify-content: center;
            color: #666; font-size: 22px; border-bottom: 1px dashed #444; }
  #finish { height: 60vh; display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 16px; }
  #target { padding: 26px 54px; font-size: 24px; background: #1a7f37; color: #fff;
            border: 0; border-radius: 12px; cursor: pointer; }
  #result { font-size: 22px; min-height: 36px; }
  #next { width: 220px; padding: 12px; font-size: 18px; background: #0d6efd;
          color: #fff; border: 0; border-radius: 8px; cursor: pointer; }
</style>
</head>
<body>
<nav>
  <a href="index.html">#главная</a>
  <a href="dragdrop.html">#dragdrop</a>
  <a href="avoidance.html">#avoidance</a>
  <a href="scroll.html">#scroll</a>
  <a href="widgets.html">#widgets</a>
</nav>
<h1>ЗАДАЧА: прокрути страницу ВНИЗ до самого конца и нажми зелёную кнопку</h1>
<div class="filler">⬇ листай вниз… (экран 1 из 4)</div>
<div class="filler">⬇ ещё вниз… (экран 2 из 4)</div>
<div class="filler">⬇ почти… (экран 3 из 4)</div>
<div id="finish">
  <button id="target">Я В САМОМ НИЗУ — НАЖМИ МЕНЯ</button>
  <div id="result"></div>
  <button id="next" onclick="location.href='widgets.html'">Далее →</button>
</div>
<script>
document.getElementById('target').addEventListener('click', () => {
  const r = document.getElementById('result');
  r.textContent = '✅ Скролл + клик верные — ТЕСТ ПРОЙДЕН';
  r.style.color = '#39d353';
});
</script>
</body>
</html>
