<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Visual Test (3 questions)</title>
<style>body{font-family:sans-serif;max-width:640px;} .q{margin:26px 0 190px 0;} label{display:block;margin:10px 0;} #submit{margin:40px 0 120px 0;font-size:18px;padding:10px 28px;}</style>
</head>
<body>
<h1>Visual Test (3 questions)</h1>
<div class="q">
<p>Q1. Which figure is the <b>hexagon</b>?</p>
<label><input type="radio" name="q1" value="A"> Option A
<svg width="60" height="60"><rect x="5" y="5" width="50" height="50" fill="green"/></svg></label>
<label><input type="radio" name="q1" value="B"> Option B
<svg width="60" height="60"><circle cx="30" cy="30" r="25" fill="red"/></svg></label>
<label><input type="radio" name="q1" value="C"> Option C
<svg width="60" height="60"><polygon points="30,5 55,55 5,55" fill="blue"/></svg></label>
<label><input type="radio" name="q1" value="D"> Option D
<svg width="60" height="60"><polygon points="30,4 37,22 56,22 41,34 47,52 30,41 13,52 19,34 4,22 23,22" fill="gold"/></svg></label>
<label><input type="radio" name="q1" value="E"> Option E
<svg width="60" height="60"><polygon points="30,5 52,17 52,43 30,55 8,43 8,17" fill="purple"/></svg></label>
<label><input type="radio" name="q1" value="F"> Option F
<svg width="60" height="60"><polygon points="30,5 55,30 30,55 5,30" fill="orange"/></svg></label>
</div>
<div class="q">
<p>Q2. Which figure is the <b>five-pointed star</b>?</p>
<label><input type="radio" name="q2" value="A"> Option A
<svg width="60" height="60"><circle cx="30" cy="30" r="25" fill="red"/></svg></label>
<label><input type="radio" name="q2" value="B"> Option B
<svg width="60" height="60"><polygon points="30,4 37,22 56,22 41,34 47,52 30,41 13,52 19,34 4,22 23,22" fill="gold"/></svg></label>
<label><input type="radio" name="q2" value="C"> Option C
<svg width="60" height="60"><rect x="5" y="5" width="50" height="50" fill="green"/></svg></label>
<label><input type="radio" name="q2" value="D"> Option D
<svg width="60" height="60"><polygon points="30,5 52,17 52,43 30,55 8,43 8,17" fill="purple"/></svg></label>
<label><input type="radio" name="q2" value="E"> Option E
<svg width="60" height="60"><polygon points="30,5 55,55 5,55" fill="blue"/></svg></label>
<label><input type="radio" name="q2" value="F"> Option F
<svg width="60" height="60"><polygon points="30,5 55,30 30,55 5,30" fill="orange"/></svg></label>
</div>
<div class="q">
<p>Q3. Which figure is the <b>diamond (rhombus)</b>?</p>
<label><input type="radio" name="q3" value="A"> Option A
<svg width="60" height="60"><polygon points="30,5 55,55 5,55" fill="blue"/></svg></label>
<label><input type="radio" name="q3" value="B"> Option B
<svg width="60" height="60"><circle cx="30" cy="30" r="25" fill="red"/></svg></label>
<label><input type="radio" name="q3" value="C"> Option C
<svg width="60" height="60"><rect x="5" y="5" width="50" height="50" fill="green"/></svg></label>
<label><input type="radio" name="q3" value="D"> Option D
<svg width="60" height="60"><polygon points="30,5 55,30 30,55 5,30" fill="orange"/></svg></label>
<label><input type="radio" name="q3" value="E"> Option E
<svg width="60" height="60"><polygon points="30,4 37,22 56,22 41,34 47,52 30,41 13,52 19,34 4,22 23,22" fill="gold"/></svg></label>
<label><input type="radio" name="q3" value="F"> Option F
<svg width="60" height="60"><polygon points="30,5 52,17 52,43 30,55 8,43 8,17" fill="purple"/></svg></label>
</div>
<button id="submit" type="button" onclick="check()">Submit</button>
<div id="result" style="font-weight:bold;margin:10px 0 60px 0;"></div>
<script>
function mark(name, good){
  const v = document.querySelector(`input[name=${name}]:checked`);
  const ok = v && v.value === good;
  return {ok: ok, label: ok ? 'correct' : 'wrong'};
}
function check(){
  const r1 = mark('q1', 'E'), r2 = mark('q2', 'B'), r3 = mark('q3', 'D');
  const score = [r1, r2, r3].filter(r => r.ok).length;
  document.getElementById('result').textContent =
    `Score: ${score}/3 (Q1: ${r1.label}, Q2: ${r2.label}, Q3: ${r3.label})`;
}
</script>
</body>
</html>
